# harness2-eval squid policy (NetOps spec v2 §4.3, FROZEN).
# Installed to /etc/squid/squid.conf by proxy-bootstrap.sh.
#
# Phase switching (h2-egress) copies the phase's allowlists to:
#   /etc/squid/h2-active-connect.acl   (dstdomain, CONNECT :443)
#   /etc/squid/h2-active-http80.acl    (dstdomain, plain HTTP :80, apt only)
# and reloads squid. Boot default is `closed` (both lists contain only
# .invalid, which can never match a real name).

# ---- listener: inner interface ONLY (10.99.0.10) ----
http_port 10.99.0.10:3128

# Squid resolves names itself via the two external resolvers (§4.2
# option a). The VPC resolver is disabled VPC-wide.
dns_nameservers 1.1.1.1 9.9.9.9

# ---- privacy / hygiene ----
via off
forwarded_for delete
cache deny all
httpd_suppress_version_string on

# ---- ACL definitions ----
acl h2_connect_allow dstdomain "/etc/squid/h2-active-connect.acl"
acl h2_http80_allow  dstdomain "/etc/squid/h2-active-http80.acl"

acl SSL_443 port 443
acl Plain_80 port 80
acl CONNECT method CONNECT

# IP-literal destinations (dotted-quad or bracketed IPv6 host part).
acl ip_literal_host dstdom_regex ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$
acl ip_literal_v6 dstdom_regex ^\[

# Private / link-local / CGNAT / loopback / benchmark / multicast /
# reserved destinations, resolved or literal (full §4.3 deny set).
# 10/8 covers the VPC itself, so squid can never be used to reach :4000,
# the EIC endpoint, or the proxy's own services.
acl deny_dst dst 0.0.0.0/8
acl deny_dst dst 10.0.0.0/8
acl deny_dst dst 100.64.0.0/10
acl deny_dst dst 127.0.0.0/8
acl deny_dst dst 169.254.0.0/16
acl deny_dst dst 172.16.0.0/12
acl deny_dst dst 192.168.0.0/16
acl deny_dst dst 198.18.0.0/15
acl deny_dst dst 224.0.0.0/4
acl deny_dst dst 240.0.0.0/4
# All of IPv6 (also covers fd00:ec2::/32 IMDS).
acl deny_dst_v6 dst ::/0

# ---- rules: every deny comes BEFORE any allow (§12 item 7) ----
http_access deny ip_literal_host
http_access deny ip_literal_v6
http_access deny deny_dst
http_access deny deny_dst_v6

# CONNECT: port 443 only, allowlisted names only.
http_access deny CONNECT !SSL_443
http_access allow CONNECT h2_connect_allow

# Plain HTTP: port 80 only, apt hosts only (non-empty only in `setup`).
http_access allow Plain_80 h2_http80_allow !CONNECT

# Default deny.
http_access deny all

# ---- logging: egress evidence, exported per arm ----
access_log /var/log/squid/access.log squid
logfile_rotate 10

# Don't phone home with error page signatures.
err_page_stylesheet none
